[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentur-leads"
version = "0.1.0"
description = "Lead-Finder für eine regionale Web- & Social-Agentur: Handwerker und Immobilienmakler finden und auditieren."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pillow>=10.0",
]

[project.optional-dependencies]
ki = ["anthropic>=0.70", "pydantic>=2.5"]
report = ["matplotlib>=3.8", "playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
agentur-leads = "agentur_leads.cli:main"

[tool.setuptools.packages.find]
include = ["agentur_leads*"]

[tool.setuptools.package-data]
agentur_leads = ["report/fonts/*.ttf", "report/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
