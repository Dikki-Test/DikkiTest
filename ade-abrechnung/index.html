:root {
  color-scheme: dark;
  --bg: #0b0b0e;
  --surface: #15151b;
  --surface-2: #1d1d25;
  --surface-3: #2a2a35;
  --line: rgba(255, 255, 255, .08);
  --line-strong: rgba(255, 255, 255, .16);
  --text: #f4f4f6;
  --text-2: #c5c5ce;
  --muted: #8e8e9a;
  --accent: #d4ff3a;
  --accent-ink: #0b0b0e;
  --pos: #3987e5;   /* bekommt Geld */
  --neg: #e66767;   /* muss zahlen */
  --axis: #3a3a44;
  --good: #0ca30c;
  --warn: #fab219;
  --bad: #d03b3b;
  --danger: #ff8080;
  --radius: 20px;
  --radius-sm: 12px;
  --tabbar: 66px;
  --font: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(70% 45% at 0% 0%, rgba(124, 92, 255, .22), transparent 70%),
    radial-gradient(55% 35% at 100% 4%, rgba(212, 255, 58, .10), transparent 70%);
}
body:has(dialog[open]) { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: not-allowed; opacity: .35; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.app {
  max-width: 600px;
  margin: 0 auto;
  padding: 0 16px calc(var(--tabbar) + 110px + env(safe-area-inset-bottom));
}

/* --- Kopfzeile ----------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0 -16px;
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  background: rgba(11, 11, 14, .74);
  -webkit-backdrop-filter: saturate(150%) blur(18px);
  backdrop-filter: saturate(150%) blur(18px);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand > div { min-width: 0; }
.mark {
  flex: none; width: 42px; height: 42px; border-radius: 13px;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 6px 24px rgba(212, 255, 58, .22);
}
.brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.brand p { font-size: 13px; color: var(--muted); }
.brand h1, .brand p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill {
  flex: none; display: inline-flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13px; font-weight: 600; color: var(--text-2);
}
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.pos { background: var(--pos); }
.dot.neg { background: var(--neg); }
.status-server .dot { background: var(--good); box-shadow: 0 0 0 4px rgba(12, 163, 12, .2); }
.status-offline .dot { background: var(--warn); }
.status-locked .dot { background: var(--bad); }

/* --- Karten -------------------------------------------------------------- */
.card {
  margin-top: 14px; padding: 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.card-title {
  margin-bottom: 12px;
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted);
}
.card > .muted { font-size: 15px; }
.card > * + .muted, .card > .muted + * { margin-top: 10px; }
.hint { margin-top: 12px; font-size: 13px; color: var(--muted); }

.hero {
  padding: 22px 20px 20px;
  background:
    linear-gradient(135deg, rgba(212, 255, 58, .09), rgba(124, 92, 255, .12)),
    var(--surface);
  border-color: rgba(255, 255, 255, .1);
}
.hero-total { margin: 4px 0 8px; font-size: clamp(42px, 13vw, 60px); font-weight: 700; letter-spacing: -.035em; line-height: 1.02; }
.hero-meta { color: var(--text-2); font-size: 15px; }
.me-line {
  display: flex; align-items: center; gap: 10px;
  margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 17px;
}
.me-line strong { font-weight: 700; }

.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  margin-top: 14px; padding: 14px 14px 14px 16px;
  border-radius: var(--radius);
  background: rgba(212, 255, 58, .08);
  border: 1px solid rgba(212, 255, 58, .3);
  font-size: 14px; color: var(--text-2);
}
.banner strong { color: var(--text); }

.empty { text-align: center; padding: 28px 22px; }
.empty-emoji { font-size: 40px; line-height: 1; }
.empty h2 { margin-top: 12px; font-size: 20px; }
.empty .muted { margin: 8px auto 18px; max-width: 34ch; }

/* --- Buttons & Chips ----------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px;
  border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface-2);
  font-weight: 600; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: #e2ff70; }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--danger); background: transparent; }
.btn-small { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn-block { width: 100%; white-space: normal; text-align: center; }
.btn-grow { flex: 1; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.icon-btn {
  display: inline-grid; place-items: center; flex: none;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line-strong); background: var(--surface-2);
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll {
  flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
  margin: 0 -18px; padding: 2px 18px;
}
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 8px;
  min-height: 42px; padding: 0 15px;
  border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface-2);
  font-weight: 500; white-space: nowrap;
}
.chip .avatar { margin-left: -8px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip[aria-pressed="true"] .avatar { background: var(--accent-ink); color: var(--accent); }

.avatar {
  --size: 32px;
  display: inline-grid; place-items: center; flex: none;
  width: var(--size); height: var(--size); border-radius: 50%;
  background: var(--surface-3); color: var(--text);
  font-size: calc(var(--size) * .44); font-weight: 700; line-height: 1;
}
.avatar.is-me { box-shadow: 0 0 0 2px var(--accent); }
.tag {
  display: inline-block; margin-left: 6px; padding: 1px 7px;
  border-radius: 999px; background: var(--surface-3);
  font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--text-2);
  vertical-align: 2px;
}

/* --- Wer zahlt wem ------------------------------------------------------- */
.transfer { padding: 16px 0; border-top: 1px solid var(--line); }
.transfer:first-of-type { border-top: 0; padding-top: 6px; }
.transfer-who { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; font-weight: 600; }
.person { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.person-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arrow { display: inline-flex; color: var(--muted); }
.transfer-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 12px; margin-top: 10px; }
.transfer-amount { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.transfer-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.transfer.is-mine .transfer-amount { color: var(--accent); }
.all-square { padding: 6px 0 4px; font-size: 17px; font-weight: 600; }
.share-btn { margin-top: 14px; }

/* --- Kontostand (divergierende Balken) ----------------------------------- */
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin: -2px 0 6px; font-size: 13px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.bal-row { padding: 10px 0 8px; }
.bal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.bal-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bal-text { flex: none; color: var(--text-2); font-size: 14px; }
.bal-track { position: relative; height: 10px; margin-top: 8px; border-radius: 5px; background: rgba(255, 255, 255, .035); }
.bal-track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.bal-bar { position: absolute; top: 0; bottom: 0; }
.bal-bar.pos { left: calc(50% + 1px); background: var(--pos); border-radius: 0 4px 4px 0; }
.bal-bar.neg { right: 50%; background: var(--neg); border-radius: 4px 0 0 4px; }

/* --- Kategorien ---------------------------------------------------------- */
.cat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 7px 0; }
.cat-label { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-value { font-size: 14px; color: var(--text-2); }
.cat-track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .035); }
.cat-bar { height: 100%; min-width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }

/* --- Tabelle ------------------------------------------------------------- */
.table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
@media (max-width: 380px) { .table { font-size: 13px; } }
.table th, .table td { padding: 10px 0 10px 10px; text-align: right; white-space: nowrap; }
.table thead th { padding-top: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.table tbody th { padding-left: 0; text-align: left; font-weight: 600; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
.table tbody tr { border-top: 1px solid var(--line); }

/* --- Ausgabenliste ------------------------------------------------------- */
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 4px 0; }
.list-head h2 { font-size: 24px; letter-spacing: -.02em; }
.day {
  display: flex; justify-content: space-between; gap: 12px;
  margin: 22px 4px 8px;
  font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--text-2);
}
.day .muted { font-weight: 500; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  width: 100%; padding: 12px 14px;
  background: none; border: 0; border-top: 1px solid var(--line);
  text-align: left;
}
.row:first-child { border-top: 0; }
.row:hover { background: rgba(255, 255, 255, .03); }
.row-icon {
  width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center;
  background: var(--surface-2); font-size: 22px;
}
.row-main { display: flex; flex-direction: column; min-width: 0; }
.row-title, .row-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-title { font-weight: 600; }
.row-sub { font-size: 13px; color: var(--muted); }
.row-amount { align-self: start; margin-top: 1px; font-weight: 700; white-space: nowrap; }
.row-me { display: inline-flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 13px; color: var(--text-2); white-space: nowrap; }

/* --- Gruppe -------------------------------------------------------------- */
.field {
  display: block; width: 100%; min-height: 48px; padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  -webkit-appearance: none; appearance: none;
}
.field::placeholder, .mini-input::placeholder, .amount-input::placeholder { color: #6c6c78; }
.field:focus, .mini-input:focus { outline: none; border-color: var(--accent); }
.field-small { min-height: 42px; padding: 8px 12px; }  /* 16px Schrift, sonst zoomt iOS beim Antippen */
input[type="date"].field { text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.8); }
.label {
  display: block; margin: 20px 0 8px;
  font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}
.card .label:first-of-type { margin-top: 0; }
.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.member { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.member:first-of-type { border-top: 0; padding-top: 0; }
.member .avatar { margin-top: 4px; }
.member-fields { flex: 1; display: grid; gap: 8px; min-width: 0; }
.sync-state { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.stand { margin-top: 12px; font-size: 13px; color: var(--text-2); }
.card .btn-block { margin-top: 14px; }
.footnote { margin: 22px 4px 0; font-size: 12px; color: var(--muted); }

/* --- Floating Button & Tabs ---------------------------------------------- */
.fab {
  position: fixed; z-index: 20;
  right: max(16px, calc(50% - 300px + 16px));
  bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom));
  display: inline-flex; align-items: center; gap: 8px;
  height: 56px; padding: 0 22px 0 18px;
  border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  font-size: 16px; font-weight: 700;
  box-shadow: 0 10px 30px rgba(212, 255, 58, .25), 0 4px 14px rgba(0, 0, 0, .45);
}
.tabbar {
  position: fixed; z-index: 15; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center; gap: 4px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: rgba(11, 11, 14, .86);
  -webkit-backdrop-filter: saturate(150%) blur(18px);
  backdrop-filter: saturate(150%) blur(18px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1; max-width: 180px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0; border: 0; border-radius: 12px;
  background: none; color: var(--muted);
  font-size: 12px; font-weight: 600;
}
.tabbar button[aria-current="page"] { color: var(--text); }
.tabbar button[aria-current="page"] svg { color: var(--accent); }

/* --- Dialoge (Bottom Sheet) ---------------------------------------------- */
dialog.sheet {
  position: fixed; inset: auto 0 0 0;
  width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh;
  margin: 0 auto; padding: 0;
  border: 1px solid var(--line-strong); border-bottom: 0;
  border-radius: 24px 24px 0 0;
  background: var(--surface); color: var(--text);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, .55);
}
dialog.sheet[open] { display: flex; flex-direction: column; animation: sheet-in .22s ease-out; }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .62); }
@keyframes sheet-in { from { transform: translateY(28px); opacity: 0; } }
@media (min-width: 640px) {
  dialog.sheet { inset: 0; margin: auto; max-height: 88vh; border-radius: 24px; border-bottom: 1px solid var(--line-strong); }
}
dialog.sheet.small { max-width: 440px; }
.sheet-form { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 6px; }
.sheet-head h2 { font-size: 20px; letter-spacing: -.02em; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px 20px; }
.sheet-foot {
  display: flex; gap: 10px;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
}
.amount-wrap { display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 10px 0 16px; }
.amount-input {
  width: 5ch; min-width: 0; max-width: calc(100% - 40px); padding: 4px 0;
  background: none; border: 0; border-bottom: 2px solid var(--line-strong); border-radius: 0;
  text-align: center; font-size: 46px; font-weight: 700; letter-spacing: -.03em;
}
.amount-input:focus { outline: none; border-bottom-color: var(--accent); }
.amount-cur { font-size: 30px; font-weight: 600; color: var(--muted); }
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 6px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px;
}
.seg button { min-height: 40px; border: 0; border-radius: 10px; background: none; color: var(--text-2); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.split-list { margin-top: 6px; }
.split-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 56px; padding: 8px 0;
  background: none; border: 0; border-top: 1px solid var(--line);
  text-align: left;
}
.split-row:first-child { border-top: 0; }
.split-name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.split-val { min-width: 76px; text-align: right; font-size: 14px; color: var(--text-2); }
.check {
  display: inline-grid; place-items: center; flex: none;
  width: 24px; height: 24px; border-radius: 7px;
  border: 1.5px solid var(--line-strong);
}
.check-row[aria-pressed="true"] .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check-row[aria-pressed="false"] .split-name { color: var(--muted); }
.mini-wrap { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.mini-input {
  width: 104px; min-height: 42px; padding: 8px 10px;
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 10px;
  text-align: right;
}
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 999px; }
.stepper button { width: 38px; height: 38px; border: 0; background: none; font-size: 20px; line-height: 1; }
.stepper output { min-width: 26px; text-align: center; font-weight: 600; }
.split-status { margin-top: 8px; font-size: 14px; color: var(--warn); }
.split-status.ok { color: var(--text-2); }
.form-error { margin-top: 16px; color: var(--danger); font-weight: 600; }
.form-error:empty { display: none; }
.meta-line { margin-top: 18px; font-size: 13px; color: var(--muted); }

/* --- Toast --------------------------------------------------------------- */
.toast {
  position: fixed; z-index: 100; left: 50%;
  bottom: calc(var(--tabbar) + 84px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 14px;
  width: max-content; max-width: calc(100% - 32px);
  padding: 12px 16px; border-radius: 14px;
  background: #f4f4f6; color: #0b0b0e;
  font-size: 15px; font-weight: 600;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .5);
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { flex: none; padding: 4px 2px; border: 0; background: none; color: #5b3df5; font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="9" width="3.4" height="11" rx="1.7"/><rect x="7.6" y="4" width="3.4" height="16" rx="1.7"/><rect x="13.2" y="11" width="3.4" height="9" rx="1.7"/><rect x="18.8" y="6.5" width="3.4" height="13.5" rx="1.7"/></svg>
      </span>
      <div>
        <h1 id="title">ADE 2026</h1>
        <p id="subtitle">Amsterdam</p>
      </div>
    </div>
    <button class="pill status-local" id="syncPill" type="button"><span class="dot"></span><span id="syncLabel">Lokal</span></button>
  </header>

  <main>
    <section class="view" id="view-overview" aria-label="Übersicht"></section>
    <section class="view" id="view-expenses" aria-label="Ausgaben" hidden></section>

  </main>
</div>

<button class="fab" id="fab" type="button">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Ausgabe
</button>

<nav class="tabbar" aria-label="Bereiche">
  <button type="button" data-view="overview" aria-current="page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>
    Übersicht
  </button>
  <button type="button" data-view="expenses" aria-current="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9.5 8h5M9.5 12h5M9.5 16h3"/></svg>
    Ausgaben
  </button>
  <button type="button" data-view="group" aria-current="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.6 14.6c2.5.2 4.2 2 4.9 4.9"/></svg>
    Gruppe
  </button>
</nav>

<dialog class="sheet" id="expenseDialog"></dialog>
<dialog class="sheet small" id="paymentDialog"></dialog>
<dialog class="sheet small" id="keyDialog"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // --- Einstellungen ----------------------------------------------------------
  const CONFIG = {
    title: 'ADE 2026',
    place: 'Amsterdam',
    // Eure Namen – lassen sich auch später in der App unter „Gruppe“ ändern.
    people: ['Person 1', 'Person 2', 'Person 3', 'Person 4'],
    // Optional: feste Adresse für Teilen-Links, z. B. 'https://yland.media/ade/'
    publicUrl: '',
    pollMs: 4000,
  };

  const CATEGORIES = [
    { id: 'tickets', label: 'Tickets', icon: '🎟️' },
    { id: 'stay', label: 'Unterkunft', icon: '🏠' },
    { id: 'travel', label: 'Anreise', icon: '🚆' },
    { id: 'transit', label: 'Taxi & Öffis', icon: '🚕' },
    { id: 'food', label: 'Essen', icon: '🍟' },
    { id: 'drinks', label: 'Drinks', icon: '🍻' },
    { id: 'groceries', label: 'Einkauf', icon: '🛒' },
    { id: 'other', label: 'Sonstiges', icon: '✨' },
  ];
  const CAT = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
  // Erste passende Regel gewinnt – deshalb steht „Taxi zum Club“ vor den Tickets.
  const CATEGORY_HINTS = [
    ['stay', /airbnb|hotel|hostel|unterkunft|übernacht|booking|apartment|wohnung|zimmer/i],
    ['transit', /uber|bolt|taxi|tram|metro|u-?bahn|straßenbahn|gvb|ov-?chip|öffi|fähre|ferry|fahrrad|scooter/i],
    ['travel', /\bzug|bahn|\bice\b|\bdb\b|flix|\bbus\b|flug|benzin|tank|sprit|diesel|maut|park(en|haus|platz|ing)|mietwagen|anreise|rückfahrt|hinfahrt|\bauto\b/i],
    ['groceries', /albert ?heijn|\bah\b|jumbo|supermarkt|einkauf|lidl|aldi|rewe|edeka|kiosk|späti/i],
    ['drinks', /bier|beer|drink|getränk|\bbar\b|\bshots?\b|cocktail|\bwein|wine|heineken|\bgin\b|vodka|wodka|\bmate\b|sekt|prosecco|\brunde/i],
    ['food', /essen|döner|kebab|pizza|burger|pommes|fries|frites|frühstück|brunch|dinner|abendessen|mittag|lunch|sushi|febo|kibbeling|stroopwafel|bäcker|bakery|snack|restaurant|imbiss|pasta|falafel|bowl|mcdonald|kfc|frikandel|bitterballen|pancake|poffertjes|kaffee|coffee/i],
    ['tickets', /ticket|karte|eintritt|einlass|festival|rave|club|line-?up|\bade\b|event|party|konzert/i],
  ];
  const guessCategory = title => (CATEGORY_HINTS.find(([, re]) => re.test(title)) || ['other'])[0];

  const MAX_CENTS = 10000000; // 100.000 €
  const ID_RE = /^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$/;
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const COLS = ['meta', 'members', 'items'];

  // --- Kleine Helfer ----------------------------------------------------------
  const $ = sel => document.querySelector(sel);
  const dict = () => Object.create(null);
  const sum = list => list.reduce((a, b) => a + b, 0);
  const EUR = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  const fmt = cents => EUR.format(cents / 100);
  const fmtSigned = cents => (cents > 0 ? '+' : cents < 0 ? '−' : '') + fmt(Math.abs(cents));
  const toInput = cents => (cents / 100).toFixed(2).replace('.', ',');
  const TIME_FMT = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const STAMP_FMT = new Intl.DateTimeFormat('de-DE', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
  const DAY_FMT = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });

  function hash(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  function uid() {
    const bytes = crypto.getRandomValues(new Uint8Array(10));
    return 'x' + Array.from(bytes, b => (b % 36).toString(36)).join('');
  }

  function isoDate(d = new Date()) {
    const z = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
  }

  function dayLabel(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const day = new Date(y, m - 1, d);
    const now = new Date();
    const diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - day) / 864e5);
    if (diff === 0) return 'Heute';
    if (diff === 1) return 'Gestern';
    return DAY_FMT.format(day);
  }

  // Betrag aus Texteingabe in Cent. Versteht „12,50“, „12.50“, „1.234,56“ und „12+8,50“.
  function parseAmount(input) {
    const s = String(input == null ? '' : input).replace(/[\s€]/g, '');
    if (!s) return null;
    let total = 0;
    for (const part of s.split('+')) {
      const cents = parsePart(part);
      if (cents == null) return null;
      total += cents;
    }
    return total;
  }

  function parsePart(s) {
    if (!/^[\d.,]+$/.test(s)) return null;
    const m = /[.,](\d{0,2})$/.exec(s);
    const intPart = m ? s.slice(0, m.index) : s;
    const thousands = m && s[m.index] === '.' ? ',' : '.';
    if (!new RegExp('^\\d{1,3}(\\' + thousands + '\\d{3})*$|^\\d*$').test(intPart)) return null;
    const cents = Number(intPart.replace(/[.,]/g, '') || '0') * 100 + Number(((m ? m[1] : '') + '00').slice(0, 2));
    return Number.isSafeInteger(cents) ? cents : null;
  }

  // --- Speicher (localStorage, sonst nur im Arbeitsspeicher) ------------------
  const memory = new Map();
  const store = {
    get(k) {
      try {
        const v = localStorage.getItem(k);
        if (v != null) return v;
      } catch { /* privater Modus o. Ä. */ }
      return memory.has(k) ? memory.get(k) : null;
    },
    set(k, v) {
      memory.set(k, v);
      try { localStorage.setItem(k, v); return true; } catch { return false; }
    },
    del(k) {
      memory.delete(k);
      try { localStorage.removeItem(k); } catch { /* egal */ }
    },
  };
  const SCOPE = 'ade:' + location.pathname.replace(/index\.html?$/, '');
  const KEYS = {
    state: SCOPE + ':state', me: SCOPE + ':me', key: SCOPE + ':key',
    mode: SCOPE + ':mode', date: SCOPE + ':date', dirty: SCOPE + ':dirty', setup: SCOPE + ':setup',
  };

  // --- Datenmodell --------------------------------------------------------------
  // Jeder Datensatz hat eine id und einen Zeitstempel u. Beim Zusammenführen gewinnt
  // die neuere Version; Löschen setzt deleted: true, damit es sich mitverbreitet.
  function emptyState() {
    return { meta: dict(), members: dict(), items: dict() };
  }

  function baseState() {
    const s = emptyState();
    s.meta.group = { id: 'group', u: 0, name: CONFIG.title, place: CONFIG.place };
    CONFIG.people.forEach((name, i) => {
      const id = 'p' + (i + 1);
      s.members[id] = { id, u: 0, name, paypal: '', order: i + 1 };
    });
    return s;
  }

  function isNewer(a, b) {
    if (!b) return true;
    if (a.u !== b.u) return a.u > b.u;
    return JSON.stringify(a) > JSON.stringify(b);
  }

  function mergeRecord(target, col, rec) {
    if (!isNewer(rec, target[col][rec.id])) return false;
    target[col][rec.id] = rec;
    return true;
  }

  function mergeState(target, source) {
    const changed = { meta: 0, members: 0, items: 0, total: 0 };
    for (const col of COLS) {
      for (const rec of Object.values(source[col])) {
        if (mergeRecord(target, col, rec)) { changed[col]++; changed.total++; }
      }
    }
    return changed;
  }

  function exportPayload(s) {
    const out = { v: 1 };
    for (const col of COLS) out[col] = Object.values(s[col]).filter(r => r.u > 0);
    return out;
  }

  const clean = (v, max) => (typeof v === 'string' ? v.replace(/\s+/g, ' ').trim().slice(0, max) : '');
  const isId = v => typeof v === 'string' && ID_RE.test(v);
  const isStamp = v => Number.isFinite(v) && v >= 0 && v < 1e14;
  const isCents = v => Number.isSafeInteger(v) && v > 0 && v <= MAX_CENTS;

  function cleanPaypal(v) {
    const s = clean(v, 120).replace(/^https?:\/\//i, '').replace(/^(www\.)?paypal\.me\//i, '').replace(/^@/, '').split(/[/?#\s]/)[0];
    return /^[A-Za-z0-9._-]{1,40}$/.test(s) ? s : '';
  }

  // Map von Personen-IDs auf Zahlen; Nullen fallen weg, Unsinn macht alles ungültig.
  function cleanMap(obj, value) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
    const out = dict();
    let n = 0;
    for (const [k, v] of Object.entries(obj)) {
      const val = value(v);
      if (!isId(k) || val == null || ++n > 50) return null;
      if (val !== 0) out[k] = val;
    }
    return Object.keys(out).length ? out : null;
  }

  // Prüft einen Datensatz (aus Link, Datei, Server oder Formular) und gibt eine saubere Kopie zurück.
  function sanitize(col, r) {
    if (!r || typeof r !== 'object' || !isId(r.id) || !isStamp(r.u)) return null;
    if (col === 'meta') {
      if (r.id !== 'group') return null;
      return { id: 'group', u: r.u, name: clean(r.name, 40) || CONFIG.title, place: clean(r.place, 40) };
    }
    if (col === 'members') {
      const m = { id: r.id, u: r.u, name: clean(r.name, 24) || 'Ohne Namen', paypal: cleanPaypal(r.paypal), order: Number.isFinite(r.order) ? r.order : 99 };
      if (r.deleted) m.deleted = true;
      return m;
    }
    if (col !== 'items' || (r.kind !== 'expense' && r.kind !== 'payment')) return null;
    if (r.deleted) return { id: r.id, u: r.u, kind: r.kind, deleted: true };
    if (!isCents(r.amount) || typeof r.date !== 'string' || !DATE_RE.test(r.date)) return null;
    const base = { id: r.id, u: r.u, kind: r.kind, amount: r.amount, date: r.date, created: isStamp(r.created) ? r.created : r.u };
    if (isId(r.by)) base.by = r.by;
    if (r.kind === 'payment') {
      if (!isId(r.from) || !isId(r.to) || r.from === r.to) return null;
      return { ...base, from: r.from, to: r.to };
    }
    const paidBy = cleanMap(r.paidBy, v => (Number.isSafeInteger(v) && v >= 0 ? v : null));
    if (!paidBy || sum(Object.values(paidBy)) !== r.amount) return null;
    const split = r.split || {};
    let values = null;
    if (split.mode === 'equal') values = cleanMap(split.values, v => (v ? 1 : 0));
    else if (split.mode === 'shares') values = cleanMap(split.values, v => (Number.isFinite(v) && v >= 0 && v <= 1000 ? Math.round(v * 1000) / 1000 : null));
    else if (split.mode === 'exact') {
      values = cleanMap(split.values, v => (Number.isSafeInteger(v) && v >= 0 ? v : null));
      if (values && sum(Object.values(values)) !== r.amount) values = null;
    }
    if (!values) return null;
    return {
      ...base,
      title: clean(r.title, 60) || 'Ausgabe',
      category: CAT[r.category] ? r.category : 'other',
      paidBy,
      split: { mode: split.mode, values },
    };
  }

  function sanitizeState(obj) {
    const out = emptyState();
    if (!obj || typeof obj !== 'object') return out;
    for (const col of COLS) {
      const src = obj[col];
      const list = Array.isArray(src) ? src : src && typeof src === 'object' ? Object.values(src) : [];
      for (const raw of list.slice(0, 5000)) {
        const rec = sanitize(col, raw);
        if (rec) mergeRecord(out, col, rec);
      }
    }
    return out;
  }

  // --- Rechnen ------------------------------------------------------------------
  // Anteile pro Person in Cent. Restcents gehen reihum (Startpunkt hängt an der ID),
  // damit nicht immer dieselbe Person den Extra-Cent zahlt.
  function shareOf(item) {
    const { amount, split } = item;
    const ids = Object.keys(split.values).sort();
    const out = dict();
    if (split.mode === 'exact') {
      for (const id of ids) out[id] = split.values[id];
      return out;
    }
    const weights = ids.map(id => (split.mode === 'equal' ? 1 : split.values[id]));
    const total = sum(weights);
    const exact = weights.map(w => (amount * w) / total);
    const base = exact.map(Math.floor);
    const n = ids.length;
    const start = hash(item.id) % n;
    const order = ids.map((_, i) => i).sort((a, b) => {
      const d = (exact[b] - base[b]) - (exact[a] - base[a]);
      return Math.abs(d) > 1e-9 ? d : ((a - start + n) % n) - ((b - start + n) % n);
    });
    for (let rest = amount - sum(base), k = 0; rest > 0; rest--, k++) base[order[k % n]]++;
    ids.forEach((id, i) => { out[id] = base[i]; });
    return out;
  }

  function summarize(s) {
    const bal = dict(), paid = dict(), share = dict(), byCat = dict();
    const add = (map, key, v) => { map[key] = (map[key] || 0) + v; };
    let total = 0, count = 0, payments = 0;
    for (const it of Object.values(s.items)) {
      if (it.deleted) continue;
      if (it.kind === 'payment') {
        add(bal, it.from, it.amount);
        add(bal, it.to, -it.amount);
        payments++;
        continue;
      }
      total += it.amount;
      count++;
      add(byCat, it.category, it.amount);
      for (const [id, c] of Object.entries(it.paidBy)) { add(bal, id, c); add(paid, id, c); }
      for (const [id, c] of Object.entries(shareOf(it))) { add(bal, id, -c); add(share, id, c); }
    }
    return { bal, paid, share, byCat, total, count, payments };
  }

  // Wer zahlt wem: erst exakt passende Paare, dann größter Schuldner an größten Gläubiger.
  // Ergibt höchstens (Personen − 1) Überweisungen.
  function settle(bal) {
    const rank = (a, b) => b.v - a.v || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    const debtors = [], creditors = [];
    for (const [id, v] of Object.entries(bal)) {
      if (v < 0) debtors.push({ id, v: -v });
      else if (v > 0) creditors.push({ id, v });
    }
    debtors.sort(rank);
    creditors.sort(rank);
    const out = [];
    for (const d of debtors) {
      const c = creditors.find(x => x.v === d.v);
      if (c) { out.push({ from: d.id, to: c.id, amount: d.v }); c.v = 0; d.v = 0; }
    }
    for (;;) {
      const d = debtors.filter(x => x.v > 0).sort(rank)[0];
      const c = creditors.filter(x => x.v > 0).sort(rank)[0];
      if (!d || !c) break;
      const amount = Math.min(d.v, c.v);
      out.push({ from: d.id, to: c.id, amount });
      d.v -= amount;
      c.v -= amount;
    }
    return out.sort((a, b) => b.amount - a.amount);
  }

  function fingerprint(s) {
    const parts = [];
    for (const col of COLS) for (const r of Object.values(s[col])) if (r.u > 0) parts.push(col + ':' + r.id + ':' + r.u);
    return hash(parts.sort().join('|')).toString(36).toUpperCase().padStart(4, '0').slice(-4);
  }

  // --- Teilen-Link: kompletter Stand, komprimiert im #-Teil der URL ------------------
  function toBase64Url(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromBase64Url(text) {
    const b64 = text.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    return Uint8Array.from(bin, c => c.charCodeAt(0));
  }

  async function readCapped(stream, cap) {
    const reader = stream.getReader();
    const chunks = [];
    let size = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      size += value.length;
      if (size > cap) { reader.cancel(); throw new Error('zu groß'); }
      chunks.push(value);
    }
    return new Blob(chunks).text();
  }

  async function encodeState(s) {
    const bytes = new TextEncoder().encode(JSON.stringify(exportPayload(s)));
    if (typeof CompressionStream === 'function') {
      try {
        const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
        return 'z' + toBase64Url(new Uint8Array(await new Response(stream).arrayBuffer()));
      } catch { /* dann eben unkomprimiert */ }
    }
    return 'j' + toBase64Url(bytes);
  }

  async function decodeState(text) {
    const bytes = fromBase64Url(text.slice(1));
    let json;
    if (text[0] === 'z') json = await readCapped(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')), 5e6);
    else if (text[0] === 'j') json = new TextDecoder().decode(bytes);
    else throw new Error('Unbekanntes Format');
    return sanitizeState(JSON.parse(json));
  }

  // --- Zustand ------------------------------------------------------------------
  let state = loadState();
  let view = 'overview';
  let pendingRender = false;
  let warnedStorage = false;
  let accessKey = store.get(KEYS.key) || '';
  const sync = { mode: 'local', rev: null, snap: null, busy: false, again: false, lastOk: 0, timer: 0, soon: 0 };

  function loadState() {
    const s = baseState();
    try {
      const raw = store.get(KEYS.state);
      if (raw) mergeState(s, sanitizeState(JSON.parse(raw)));
    } catch { /* kaputter Speicher: frisch anfangen */ }
    return s;
  }

  function persist() {
    const ok = store.set(KEYS.state, JSON.stringify(exportPayload(state)));
    if (!ok && !warnedStorage) {
      warnedStorage = true;
      toast('Achtung: Dein Browser speichert hier nichts dauerhaft (privater Modus?).');
    }
  }

  function dirtyIds() {
    try { return new Set(JSON.parse(store.get(KEYS.dirty) || '[]')); } catch { return new Set(); }
  }

  // Speichert Änderungen lokal (neuerer Zeitstempel als die bearbeitete Version) und stößt den Abgleich an.
  function commitAll(changes) {
    const saved = [];
    const dirty = dirtyIds();
    for (const [col, raw] of changes) {
      const cur = state[col][raw.id];
      const rec = sanitize(col, { ...raw, u: Math.max(Date.now(), cur ? cur.u + 1 : 1) });
      if (!rec) continue;
      state[col][rec.id] = rec;
      dirty.add(col + ':' + rec.id);
      saved.push(rec);
    }
    if (saved.length < changes.length) toast('Das konnte nicht gespeichert werden.');
    if (!saved.length) return [];
    persist();
    if (sync.mode === 'local') store.set(KEYS.dirty, JSON.stringify([...dirty]));
    render();
    scheduleSync();
    return saved;
  }

  const commit = (col, raw) => commitAll([[col, raw]])[0] || null;

  function members({ withDeleted = false } = {}) {
    return Object.values(state.members)
      .filter(m => withDeleted || !m.deleted)
      .sort((a, b) => a.order - b.order || (a.id < b.id ? -1 : 1));
  }
  const nameOf = id => (state.members[id] ? state.members[id].name : 'Unbekannt');
  const activeItems = () => Object.values(state.items).filter(it => !it.deleted);

  function currentMe() {
    const id = store.get(KEYS.me);
    return id && state.members[id] && !state.members[id].deleted ? id : null;
  }

  function isReferenced(id) {
    return activeItems().some(it => it.from === id || it.to === id || (it.paidBy && id in it.paidBy) || (it.split && id in it.split.values));
  }

  function needsSetup() {
    return !store.get(KEYS.setup) && members().some(m => m.u === 0 && /^Person \d+$/.test(m.name)) && activeItems().length === 0;
  }

  // Alle, die im Kontostand auftauchen: aktuelle Mitglieder plus Entfernte mit offenem Betrag.
  function balancePeople(s) {
    const ids = members().map(m => m.id);
    for (const [id, v] of Object.entries(s.bal)) if (v && !ids.includes(id)) ids.push(id);
    return ids;
  }

  // --- Server-Abgleich (nur wenn server.js die Seite ausliefert) -------------------
  function pageUrl() {
    return CONFIG.publicUrl || location.href.split('#')[0];
  }

  function apiBase() {
    let path = location.pathname;
    if (!path.endsWith('/')) path = /\.[a-z0-9]+$/i.test(path.split('/').pop()) ? path.replace(/[^/]*$/, '') : path + '/';
    return location.origin + path;
  }

  async function request(path, options = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    try {
      const headers = { 'X-Group-Key': encodeURIComponent(accessKey) };
      if (options.body) headers['Content-Type'] = 'application/json';
      const res = await fetch(apiBase() + path, { ...options, headers, cache: 'no-store', signal: ctrl.signal });
      const json = /json/.test(res.headers.get('content-type') || '') ? await res.json().catch(() => null) : null;
      return { status: res.status, json };
    } finally {
      clearTimeout(timer);
    }
  }

  function applyServer(json) {
    sync.rev = json.rev;
    sync.snap = sanitizeState(json);
    if (mergeState(state, sync.snap).total) {
      persist();
      render();
    }
  }

  function pendingRecords() {
    const out = [];
    for (const col of COLS) {
      for (const rec of Object.values(state[col])) {
        if (!(rec.u > 0)) continue;
        const known = sync.snap && sync.snap[col][rec.id];
        if (!known || isNewer(rec, known)) out.push({ col, rec });
      }
    }
    return out;
  }

  function lockOut() {
    sync.mode = 'locked';
    render();
    openKeyDialog(!!accessKey);
  }

  async function syncNow() {
    if (sync.mode === 'local' || sync.mode === 'locked') return;
    if (sync.busy) { sync.again = true; return; }
    sync.busy = true;
    try {
      const r = await request('api/state?since=' + (sync.rev == null ? '' : sync.rev));
      if (r.status === 401) return lockOut();
      if (r.status !== 200 || !r.json || r.json.ade !== 1) throw new Error('state');
      if (!r.json.unchanged) applyServer(r.json);
      const records = pendingRecords();
      if (records.length) {
        const p = await request('api/push', { method: 'POST', body: JSON.stringify({ records }) });
        if (p.status === 401) return lockOut();
        if (p.status !== 200 || !p.json || p.json.ade !== 1) throw new Error('push');
        applyServer(p.json);
      }
      sync.lastOk = Date.now();
      if (sync.mode !== 'server') { sync.mode = 'server'; render(); } else renderSyncPill();
    } catch {
      if (sync.mode !== 'offline') { sync.mode = 'offline'; render(); }
    } finally {
      sync.busy = false;
      if (sync.again) { sync.again = false; syncNow(); }
    }
  }

  function scheduleSync() {
    if (sync.mode !== 'server' && sync.mode !== 'offline') return;
    clearTimeout(sync.soon);
    sync.soon = setTimeout(syncNow, 150);
  }

  function startPolling() {
    if (sync.timer) return;
    sync.timer = setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, CONFIG.pollMs);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
    window.addEventListener('online', () => syncNow());
  }

  async function detectServer() {
    if (!/^https?:$/.test(location.protocol)) return;
    let r = null;
    try { r = await request('api/state'); } catch { r = null; }
    if (r && r.json && r.json.ade === 1) {
      store.set(KEYS.mode, 'server');
      startPolling();
      if (r.status === 401) return lockOut();
      if (r.status === 200) {
        sync.mode = 'server';
        sync.lastOk = Date.now();
        applyServer(r.json);
        render();
        syncNow();
      }
    } else if (!r && store.get(KEYS.mode) === 'server') {
      sync.mode = 'offline';
      startPolling();
      render();
    } else if (r) {
      store.del(KEYS.mode);
    }
  }

  // --- DOM-Helfer -----------------------------------------------------------------
  function append(el, children) {
    for (const child of children.flat(Infinity)) {
      if (child == null || child === false || child === '') continue;
      el.append(child instanceof Node ? child : String(child));
    }
    return el;
  }

  function fill(el, ...children) {
    el.replaceChildren();
    return append(el, children);
  }

  // Baut DOM-Knoten; Texte landen immer als Text im DOM, nie als HTML.
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'value') el.value = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    return append(el, children);
  }

  const ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    arrow: '<path d="M4 12h15M13 6l6 6-6 6"/>',
    share: '<path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  };

  function icon(name, size = 20) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    for (const [k, v] of Object.entries({ viewBox: '0 0 24 24', width: size, height: size, fill: 'none', stroke: 'currentColor', 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) svg.setAttribute(k, v);
    svg.innerHTML = ICONS[name];
    return svg;
  }

  function avatar(id, size) {
    const name = nameOf(id).trim();
    const el = h('span', { class: 'avatar' + (id === currentMe() ? ' is-me' : ''), 'aria-hidden': 'true' }, (Array.from(name)[0] || '?').toUpperCase());
    if (size) el.style.setProperty('--size', size + 'px');
    return el;
  }

  const meTag = id => (id === currentMe() ? h('span', { class: 'tag' }, 'du') : null);

  function person(id) {
    return h('span', { class: 'person' }, avatar(id), h('span', { class: 'person-name' }, nameOf(id)), meTag(id));
  }

  let toastTimer = 0;
  function toast(message, action) {
    const el = $('#toast');
    fill(el, h('span', null, message), action ? h('button', { type: 'button', onclick: () => { hideToast(); action.run(); } }, action.label) : null);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 6000 : 3000);
  }

  function hideToast() {
    $('#toast').classList.remove('show');
  }

  // --- Ansichten ----------------------------------------------------------------
  function render() {
    const meta = state.meta.group;
    $('#title').textContent = meta.name;
    $('#subtitle').textContent = [meta.place, members().length + ' Leute'].filter(Boolean).join(' · ');
    document.title = meta.name + ' · Abrechnung';
    renderSyncPill();
    for (const btn of document.querySelectorAll('[data-view]')) btn.setAttribute('aria-current', btn.dataset.view === view ? 'page' : 'false');
    for (const section of document.querySelectorAll('.view')) {
      section.hidden = section.id !== 'view-' + view;
      if (section.hidden) section.replaceChildren();
    }
    $('#fab').hidden = view === 'group';
    const el = $('#view-' + view);
    // Nicht neu zeichnen, während jemand in dieser Ansicht tippt – passiert beim Verlassen des Felds.
    const active = document.activeElement;
    if (active && el.contains(active) && active.matches('input:not([type="file"]), textarea, select')) {
      pendingRender = true;
      return;
    }
    pendingRender = false;
    if (view === 'overview') renderOverview(el);
    else if (view === 'expenses') renderExpenses(el);
    else renderGroup(el);
  }

  function renderSyncPill() {
    const pill = $('#syncPill');
    pill.className = 'pill status-' + sync.mode;
    $('#syncLabel').textContent = { local: 'Lokal', server: 'Live', offline: 'Offline', locked: 'Gesperrt' }[sync.mode];
    pill.title = {
      local: 'Gespeichert auf diesem Gerät – teilen per Link',
      server: 'Live-Abgleich aktiv' + (sync.lastOk ? ' · zuletzt ' + TIME_FMT.format(sync.lastOk) : ''),
      offline: 'Keine Verbindung – Änderungen werden später übertragen',
      locked: 'Zugangscode fehlt',
    }[sync.mode];
  }

  function localBanner() {
    if (sync.mode !== 'local') return null;
    const n = dirtyIds().size;
    if (!n) return null;
    return h('div', { class: 'banner' },
      h('p', null, h('strong', null, n === 1 ? '1 Änderung' : n + ' Änderungen'), ' bisher nur auf diesem Gerät. Schick deinen Stand in eure Gruppe.'),
      h('button', { type: 'button', class: 'btn btn-primary btn-small', onclick: shareState }, icon('share', 18), 'Teilen'));
  }

  function renderOverview(el) {
    const s = summarize(state);
    const me = currentMe();
    const transfers = settle(s.bal);
    const setup = needsSetup();
    fill(el,
      localBanner(),
      setup ? setupCard() : !me ? whoAmICard() : null,
      heroCard(s, me),
      !s.count && !s.payments && !setup ? emptyCard() : null,
      s.count || s.payments ? transfersCard(transfers, me) : null,
      s.count || s.payments ? balanceCard(s) : null,
      s.count ? categoryCard(s) : null,
      s.count ? tableCard(s) : null);
  }

  function setupCard() {
    const people = members();
    const inputs = people.map((m, i) => h('input', {
      class: 'field', maxlength: 24, autocomplete: 'off', 'data-id': m.id,
      'aria-label': 'Name ' + (i + 1), placeholder: 'Name ' + (i + 1),
      value: m.u === 0 && /^Person \d+$/.test(m.name) ? '' : m.name,
    }));
    const submit = e => {
      e.preventDefault();
      const changes = [];
      for (const input of inputs) {
        const name = input.value.trim();
        const m = state.members[input.dataset.id];
        if (m && name && name !== m.name) changes.push(['members', { ...m, name }]);
      }
      if (document.activeElement) document.activeElement.blur();
      // Leere Felder bleiben Platzhalter (nicht speichern, sonst könnten sie per Link echte Namen überschreiben)
      store.set(KEYS.setup, '1');
      if (changes.length) commitAll(changes);
      else render();
    };
    return h('form', { class: 'card', onsubmit: submit },
      h('h2', { class: 'card-title' }, 'Wer ist dabei?'),
      h('p', { class: 'muted' }, 'Tragt eure Namen ein – geht auch später noch unter „Gruppe“.'),
      h('div', { class: 'setup-grid' }, inputs),
      h('button', { type: 'submit', class: 'btn btn-primary btn-block' }, 'Los geht’s'),
      sync.mode === 'local' ? h('p', { class: 'hint' }, 'Hat dir schon jemand einen Link zur Abrechnung geschickt? Dann öffne einfach den – da sind Namen und Einträge schon drin.') : null);
  }

  function whoAmICard() {
    return h('section', { class: 'card' },
      h('h2', { class: 'card-title' }, 'Wer bist du?'),
      h('p', { class: 'muted' }, 'Dann siehst du sofort, was du bekommst oder zahlen musst. Wird nur auf diesem Gerät gemerkt.'),
      h('div', { class: 'chips', style: 'margin-top:14px' }, members().map(m =>
        h('button', { type: 'button', class: 'chip', onclick: () => { store.set(KEYS.me, m.id); render(); } }, avatar(m.id, 28), m.name))));
  }

  function heroCard(s, me) {
    const count = members().length;
    let meLine = null;
    if (me && (s.count || s.payments)) {
      const b = s.bal[me] || 0;
      meLine = h('p', { class: 'me-line' },
        h('span', { class: 'dot ' + (b > 0 ? 'pos' : b < 0 ? 'neg' : '') }),

      h('h2', { class: 'card-title' }, 'Gesamtausgaben'),
      h('p', { class: 'hero-total' }, fmt(s.total)),

  }

  function transfersCard(transfers, me) {
    const rows = transfers.map(t => {

      return h('div', { class: 'transfer' + (t.from === me || t.to === me ? ' is-mine' : '') },

  function balanceCard(s) {
    const ids = balancePeople(s);
    const max = Math.max(1, ...ids.map(id => Math.abs(s.bal[id] || 0)));
    return h('section', { class: 'card' },
      h('h2', { class: 'card-title' }, 'Kontostand'),
      h('div', { class: 'legend' },
        h('span', null, h('span', { class: 'dot pos' }), 'bekommt Geld'),
        h('span', null, h('span', { class: 'dot neg' }), 'muss zahlen')),
      ids.map(id => {
        const b = s.bal[id] || 0;
        return h('div', { class: 'bal-row', title: `${nameOf(id)}: ${fmtSigned(b)}` },
          h('div', { class: 'bal-head' },
            h('span', { class: 'bal-name' }, nameOf(id), meTag(id)),

        return h('div', { class: 'cat-row', title: `${c.label}: ${fmt(v)}` },
          h('span', { class: 'cat-label' }, h('span', { 'aria-hidden': 'true' }, c.icon + ' '), c.label),
          h('span', { class: 'cat-value num' }, fmt(v), h('span', { class: 'muted' }, ` · ${Math.round((v / s.total) * 100)} %`)),
          h('div', { class: 'cat-track', 'aria-hidden': 'true' }, h('div', { class: 'cat-bar', style: `width:${(v / max) * 100}%` })));
      }));

  function tableCard(s) {
    return h('section', { class: 'card' },
      h('h2', { class: 'card-title' }, 'Bezahlt & Anteil'),
      h('div', { class: 'table-wrap' }, h('table', { class: 'table num' },

          h('th', { scope: 'col' }, h('span', { class: 'sr-only' }, 'Person')),
          h('th', { scope: 'col' }, 'Bezahlt'),
          h('th', { scope: 'col' }, 'Anteil'),
