  }

  function renderExpenses(el) {
    const items = activeItems().sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : b.created - a.created));
    if (!items.length) {
      fill(el, localBanner(), emptyCard());
      return;
    }
    const me = currentMe();
    const days = [];
    for (const it of items) {
      const last = days[days.length - 1];
      if (last && last.date === it.date) last.items.push(it);
      else days.push({ date: it.date, items: [it] });
    }
    const expenses = items.filter(it => it.kind === 'expense');
    fill(el,
      localBanner(),
      h('div', { class: 'list-head' },
        h('h2', null, 'Ausgaben'),
        h('span', { class: 'muted num' }, `${expenses.length} · ${fmt(sum(expenses.map(it => it.amount)))}`)),
      days.map(day => [
        h('h3', { class: 'day' }, dayLabel(day.date), h('span', { class: 'muted num' }, fmt(sum(day.items.filter(it => it.kind === 'expense').map(it => it.amount))))),
        h('div', { class: 'list' }, day.items.map(it => (it.kind === 'expense' ? expenseRow(it, me) : paymentRow(it, me)))),
      ]));
  }

  function expenseRow(it, me) {
    const cat = CAT[it.category] || CAT.other;
    const payers = Object.keys(it.paidBy);
    const payerText = payers.length === 1 ? `${nameOf(payers[0])} hat bezahlt`
      : payers.length === 2 ? `${nameOf(payers[0])} & ${nameOf(payers[1])} haben bezahlt` : `${payers.length} Leute haben bezahlt`;
    const n = Object.keys(it.split.values).length;
    const splitText = it.split.mode === 'exact' ? 'feste Beträge' : it.split.mode === 'shares' ? 'nach Anteilen'
      : n === members().length ? 'für alle' : n === 1 ? 'für ' + nameOf(Object.keys(it.split.values)[0]) : `für ${n} Leute`;
    let mine = null;
    if (me) {
      const net = (it.paidBy[me] || 0) - (shareOf(it)[me] || 0);
      const involved = me in it.paidBy || me in it.split.values;
      mine = !involved ? h('span', { class: 'row-me muted' }, 'nicht dabei')
        : h('span', { class: 'row-me' }, h('span', { class: 'dot ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : '') }),
          net > 0 ? 'du bekommst ' + fmt(net) : net < 0 ? 'du schuldest ' + fmt(-net) : 'ausgeglichen');
    }
    return h('button', { type: 'button', class: 'row', onclick: () => openExpense(it.id) },
      h('span', { class: 'row-icon', 'aria-hidden': 'true' }, cat.icon),
      h('span', { class: 'row-main' }, h('span', { class: 'row-title' }, it.title), h('span', { class: 'row-sub' }, `${payerText} · ${splitText}`), mine),
      h('span', { class: 'row-amount num' }, fmt(it.amount)));
  }

  function paymentRow(it, me) {
    const mine = me === it.from ? 'du hast gezahlt' : me === it.to ? 'du hast bekommen' : null;
    return h('button', { type: 'button', class: 'row', onclick: () => openPayment({ id: it.id }) },
      h('span', { class: 'row-icon', 'aria-hidden': 'true' }, '💸'),
      h('span', { class: 'row-main' },
        h('span', { class: 'row-title' }, `${nameOf(it.from)} → ${nameOf(it.to)}`),
        h('span', { class: 'row-sub' }, 'Rückzahlung'),
        mine ? h('span', { class: 'row-me' }, mine) : null),
      h('span', { class: 'row-amount num' }, fmt(it.amount)));
  }

  function renderGroup(el) {
    const meta = state.meta.group;
    const people = members();
    const me = currentMe();
    fill(el,
      h('section', { class: 'card' },
        h('h2', { class: 'card-title' }, 'Gruppe'),
        h('label', { class: 'label', for: 'groupName' }, 'Name'),
        h('input', { id: 'groupName', class: 'field', maxlength: 40, value: meta.name, onchange: e => { if (e.target.value.trim()) commit('meta', { ...state.meta.group, name: e.target.value }); else e.target.value = state.meta.group.name; } }),
        h('label', { class: 'label', for: 'groupPlace' }, 'Ort'),
        h('input', { id: 'groupPlace', class: 'field', maxlength: 40, value: meta.place, onchange: e => commit('meta', { ...state.meta.group, place: e.target.value }) })),
      h('section', { class: 'card' },
        h('h2', { class: 'card-title' }, 'Leute'),
        people.map(m => memberEditor(m, people.length)),
        h('button', { type: 'button', class: 'btn btn-ghost', style: 'margin-top:12px', onclick: addMember }, icon('plus', 18), 'Person hinzufügen'),
        h('p', { class: 'hint' }, 'Mit PayPal.me-Namen erscheint bei „Wer zahlt wem?“ direkt ein Bezahl-Button.')),
      h('section', { class: 'card' },
        h('h2', { class: 'card-title' }, 'Du auf diesem Gerät'),
        h('div', { class: 'chips' }, people.map(m =>
          h('button', { type: 'button', class: 'chip', 'aria-pressed': String(m.id === me), onclick: () => { store.set(KEYS.me, m.id); render(); } }, avatar(m.id, 28), m.name)))),
      syncCard(),
      h('section', { class: 'card' },
        h('h2', { class: 'card-title' }, 'Backup'),
        h('p', { class: 'muted' }, 'Alle Einträge als Datei sichern oder eine Sicherung einspielen (wird zusammengeführt, nichts wird doppelt).'),
        h('div', { class: 'btn-row' },
          h('button', { type: 'button', class: 'btn', onclick: exportBackup }, 'Als Datei sichern'),
          h('label', { class: 'btn' }, 'Datei laden', h('input', { type: 'file', accept: '.json,application/json', class: 'sr-only', onchange: importBackup })))),
      sync.mode === 'local' ? h('section', { class: 'card' },
        h('h2', { class: 'card-title' }, 'Zurücksetzen'),
        h('button', { type: 'button', class: 'btn btn-danger btn-block', onclick: resetLocal }, 'Alle Daten auf diesem Gerät löschen')) : null,
      h('p', { class: 'footnote' }, 'Die Seite ist für Suchmaschinen gesperrt. Daten liegen nur in euren Browsern' + (sync.mode === 'local' ? ' und in den geteilten Links.' : ' und auf eurem Server.')));
  }

  function memberEditor(m, count) {
    const removable = count > 2 && !isReferenced(m.id);
    const update = patch => commit('members', { ...state.members[m.id], ...patch });
    return h('div', { class: 'member' },
      avatar(m.id, 40),
      h('div', { class: 'member-fields' },
        h('input', {
          class: 'field', maxlength: 24, value: m.name, 'aria-label': 'Name', 'data-member': m.id,
          onchange: e => { const name = e.target.value.trim(); if (name) update({ name }); else e.target.value = m.name; },
        }),
        h('input', {
          class: 'field field-small', value: m.paypal, placeholder: 'PayPal.me-Name (optional)', 'aria-label': 'PayPal.me-Name von ' + m.name,
          autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false',
          onchange: e => update({ paypal: e.target.value }),
        })),
      removable ? h('button', {
        type: 'button', class: 'icon-btn', 'aria-label': m.name + ' entfernen', title: 'Entfernen',
        onclick: () => { if (confirm(`${m.name} aus der Gruppe entfernen?`)) update({ deleted: true }); },
      }, icon('close', 18)) : null);
  }

  function addMember() {
    const order = Math.max(0, ...members({ withDeleted: true }).map(m => m.order)) + 1;
    const rec = commit('members', { id: uid(), name: 'Person ' + (members().length + 1), paypal: '', order });
    const input = rec && document.querySelector(`[data-member="${rec.id}"]`);
    if (input) { input.focus(); input.select(); }
  }

  function syncCard() {
    const n = activeItems().length;
    const stand = h('p', { class: 'stand num' }, `Datenstand ${fingerprint(state)} · ${n} ${n === 1 ? 'Eintrag' : 'Einträge'}`);
    const card = (status, text, ...rest) => h('section', { class: 'card', id: 'syncCard' },
      h('h2', { class: 'card-title' }, 'Abgleich'),
      h('p', { class: 'sync-state status-' + sync.mode }, h('span', { class: 'dot' }), status),
      h('p', { class: 'muted' }, text),
      stand, rest);
    if (sync.mode === 'server') {
      return card('Live-Abgleich aktiv',
        `Alle Änderungen landen sofort bei allen. Zuletzt abgeglichen um ${TIME_FMT.format(sync.lastOk || Date.now())}.`,
        h('button', { type: 'button', class: 'btn btn-primary btn-block', onclick: shareInvite }, icon('share', 18), 'Einladungslink teilen'));
    }
    if (sync.mode === 'offline') {
      return card('Offline',
        'Gerade keine Verbindung zum Server. Deine Änderungen bleiben gespeichert und werden übertragen, sobald es wieder klappt.',
        h('button', { type: 'button', class: 'btn btn-block', onclick: syncNow }, 'Erneut versuchen'));
    }
    if (sync.mode === 'locked') {
      return card('Zugangscode fehlt',
        'Der Server braucht einen Zugangscode. Er steckt im Einladungslink.',
        h('button', { type: 'button', class: 'btn btn-primary btn-block', onclick: () => openKeyDialog(false) }, 'Code eingeben'));
    }
    return card('Lokal auf diesem Gerät',
      'Eure Einträge liegen im Browser dieses Geräts. Damit alle denselben Stand haben, schickt ihr euch den Stand als Link, z. B. in eure WhatsApp-Gruppe. Wer ihn öffnet, bekommt alle Einträge dazu – nichts wird doppelt gezählt oder überschrieben. Gleicher Datenstand-Code = gleicher Stand.',
      h('button', { type: 'button', class: 'btn btn-primary btn-block', onclick: shareState }, icon('share', 18), 'Stand per Link teilen'));
  }

  // --- Ausgabe erfassen / bearbeiten ------------------------------------------------
  function fitAmount(input) {
    input.style.width = Math.max(4, input.value.length) + 1 + 'ch';
  }

  function moneyInput(value, onInput, label) {
    return h('span', { class: 'mini-wrap' },
      h('input', { class: 'mini-input num', inputmode: 'decimal', autocomplete: 'off', placeholder: '0,00', value, 'aria-label': label, oninput: e => onInput(e.target.value) }),
      '€');
  }

  function openExpense(id) {
    const dlg = $('#expenseDialog');
    const ex = id ? state.items[id] : null;
    if (id && (!ex || ex.deleted || ex.kind !== 'expense')) return;
    const me = currentMe();
    const people = members();
    if (ex) {
      for (const pid of [...Object.keys(ex.paidBy), ...Object.keys(ex.split.values)]) {
        if (!people.some(p => p.id === pid)) people.push({ id: pid, name: nameOf(pid) });
      }
    }
    const ids = people.map(p => p.id);
    const draftId = ex ? ex.id : uid();
    const f = {
      amount: ex ? toInput(ex.amount) : '',
      title: ex ? ex.title : '',
      category: ex ? ex.category : 'other',
      catTouched: !!ex,
      date: ex ? ex.date : store.get(KEYS.date) || isoDate(),
      multiPay: ex ? Object.keys(ex.paidBy).length > 1 : false,
      payer: ex ? Object.keys(ex.paidBy)[0] : me || ids[0],
      payAmounts: Object.fromEntries(ids.map(pid => [pid, ex && ex.paidBy[pid] ? toInput(ex.paidBy[pid]) : ''])),
      mode: ex ? ex.split.mode : 'equal',
      equal: new Set(ex ? Object.keys(ex.split.values) : ids),
      exact: Object.fromEntries(ids.map(pid => [pid, ex && ex.split.mode === 'exact' && ex.split.values[pid] ? toInput(ex.split.values[pid]) : ''])),
      shares: Object.fromEntries(ids.map(pid => [pid, ex && ex.split.mode === 'shares' ? ex.split.values[pid] || 0 : ex && !(pid in ex.split.values) ? 0 : 1])),
    };

    const amountInput = h('input', {
      class: 'amount-input num', inputmode: 'decimal', autocomplete: 'off', placeholder: '0,00', value: f.amount, 'aria-label': 'Betrag in Euro',
      oninput: e => { f.amount = e.target.value; fitAmount(e.target); refresh(); },
    });
    const titleInput = h('input', {
      class: 'field', maxlength: 60, autocomplete: 'off', placeholder: 'Wofür? z. B. Pizza, Uber, Tickets', value: f.title, 'aria-label': 'Beschreibung',
      oninput: e => { f.title = e.target.value; if (!f.catTouched) { f.category = guessCategory(f.title); paintCategories(); } },
    });
    const catRow = h('div', { class: 'chips scroll', role: 'group', 'aria-label': 'Kategorie' });
    const dateInput = h('input', { id: 'expenseDate', type: 'date', class: 'field', value: f.date, onchange: e => { f.date = e.target.value; } });
    const paySection = h('div', { class: 'pay-section' });
    const splitSection = h('div', { class: 'split-section' });
    const errorEl = h('p', { class: 'form-error', role: 'alert' });
    let payStatus = null, splitStatus = null, previews = dict();

    function paintCategories() {
      fill(catRow, CATEGORIES.map(c => h('button', {
        type: 'button', class: 'chip', 'aria-pressed': String(f.category === c.id),
        onclick: () => { f.category = c.id; f.catTouched = true; paintCategories(); },
      }, h('span', { 'aria-hidden': 'true' }, c.icon), c.label)));
      // Gewählte Kategorie sichtbar machen, auch wenn sie automatisch erkannt wurde
      const chip = catRow.querySelector('[aria-pressed="true"]');
      if (chip && dlg.open) {
        const row = catRow.getBoundingClientRect(), box = chip.getBoundingClientRect();
        if (box.left < row.left || box.right > row.right) catRow.scrollLeft += box.left - row.left - (row.width - box.width) / 2;
      }
    }

    function paintPay() {
      payStatus = h('p', { class: 'split-status' });
      fill(paySection,
        h('div', { class: 'chips' },
          people.map(p => h('button', {
            type: 'button', class: 'chip', 'aria-pressed': String(!f.multiPay && f.payer === p.id),
            onclick: () => { f.multiPay = false; f.payer = p.id; paintPay(); refresh(); },
          }, avatar(p.id, 28), p.name)),
          h('button', { type: 'button', class: 'chip', 'aria-pressed': String(f.multiPay), onclick: () => { f.multiPay = true; paintPay(); refresh(); } }, 'Mehrere')),
        f.multiPay ? [
          h('div', { class: 'split-list' }, people.map(p => h('div', { class: 'split-row' },
            avatar(p.id, 28), h('span', { class: 'split-name' }, p.name),
            moneyInput(f.payAmounts[p.id], v => { f.payAmounts[p.id] = v; refresh(); }, 'Bezahlt von ' + p.name)))),
          payStatus,
        ] : null);
    }

    function paintSplit() {
      splitStatus = h('p', { class: 'split-status' });
      previews = dict();
      const preview = pid => (previews[pid] = h('span', { class: 'split-val num' }));
      let rows;
      if (f.mode === 'equal') {
        rows = people.map(p => {
          const on = f.equal.has(p.id);
          return h('button', {
            type: 'button', class: 'split-row check-row', 'aria-pressed': String(on),
            onclick: () => { if (on) f.equal.delete(p.id); else f.equal.add(p.id); paintSplit(); refresh(); },
          }, h('span', { class: 'check', 'aria-hidden': 'true' }, on ? icon('check', 16) : null), avatar(p.id, 28), h('span', { class: 'split-name' }, p.name), preview(p.id));
        });
      } else if (f.mode === 'exact') {
        rows = people.map(p => h('div', { class: 'split-row' },
          avatar(p.id, 28), h('span', { class: 'split-name' }, p.name),
          moneyInput(f.exact[p.id], v => { f.exact[p.id] = v; refresh(); }, 'Anteil von ' + p.name)));
      } else {
        rows = people.map(p => {
          const out = h('output', null, String(f.shares[p.id]));
          const step = delta => { f.shares[p.id] = Math.max(0, Math.round(f.shares[p.id] + delta)); out.textContent = String(f.shares[p.id]); refresh(); };
          return h('div', { class: 'split-row' },
            avatar(p.id, 28), h('span', { class: 'split-name' }, p.name), preview(p.id),
            h('span', { class: 'stepper' },
              h('button', { type: 'button', 'aria-label': 'Weniger Anteile für ' + p.name, onclick: () => step(-1) }, '−'),
              out,
              h('button', { type: 'button', 'aria-label': 'Mehr Anteile für ' + p.name, onclick: () => step(1) }, '+')));
        });
      }
      fill(splitSection,
        h('div', { class: 'seg', role: 'group', 'aria-label': 'Art der Aufteilung' },
          [['equal', 'Gleich'], ['exact', 'Beträge'], ['shares', 'Anteile']].map(([mode, label]) => h('button', {
            type: 'button', 'aria-pressed': String(f.mode === mode),
            onclick: () => { f.mode = mode; paintSplit(); refresh(); },
          }, label))),
        h('div', { class: 'split-list' }, rows),
        splitStatus);
    }

    function draftValues() {
      const values = dict();
      for (const p of people) {
        if (f.mode === 'equal' && f.equal.has(p.id)) values[p.id] = 1;
        if (f.mode === 'shares' && f.shares[p.id] > 0) values[p.id] = f.shares[p.id];
        if (f.mode === 'exact') { const c = parseAmount(f.exact[p.id]); if (c) values[p.id] = c; }
      }
      return values;
    }

    function balanceText(amount, given, done) {
      if (!amount) return 'Erst oben den Betrag eintragen.';
      if (given === amount) return '✓ ' + done;
      return given < amount ? `Noch ${fmt(amount - given)} offen` : `${fmt(given - amount)} zu viel`;
    }

    function refresh() {
      const amount = parseAmount(f.amount) || 0;
      if (f.multiPay) {
        const paid = sum(people.map(p => parseAmount(f.payAmounts[p.id]) || 0));
        payStatus.textContent = balanceText(amount, paid, 'Passt genau');
        payStatus.classList.toggle('ok', !!amount && paid === amount);
      }
      const values = draftValues();
      const n = Object.keys(values).length;
      if (f.mode === 'exact') {
        const given = sum(Object.values(values));
        splitStatus.textContent = balanceText(amount, given, 'Alles verteilt');
        splitStatus.classList.toggle('ok', !!amount && given === amount);
        return;
      }
      const shares = amount && n ? shareOf({ id: draftId, amount, split: { mode: f.mode, values } }) : dict();
      for (const pid of Object.keys(previews)) previews[pid].textContent = shares[pid] ? fmt(shares[pid]) : '–';
      splitStatus.textContent = !n ? 'Wähle aus, wer dabei war.' : f.mode === 'equal' ? `Geteilt durch ${n}` : `${sum(Object.values(values))} Anteile insgesamt`;
      splitStatus.classList.toggle('ok', n > 0);
    }

    function fail(message, focus) {
      errorEl.textContent = message;
      errorEl.scrollIntoView({ block: 'nearest' });
      if (focus) focus.focus();
    }

    function parseList(raw) {
      const out = dict();
      for (const p of people) {
        if (!raw[p.id]) continue;
        const c = parseAmount(raw[p.id]);
        if (c == null) return `Den Betrag bei ${p.name} verstehe ich nicht.`;
        if (c) out[p.id] = c;
      }
      return out;
    }

    function save(e) {
      e.preventDefault();
      const amount = parseAmount(f.amount);
      if (!amount) return fail('Bitte gib einen Betrag ein, z. B. 12,50.', amountInput);
      if (amount > MAX_CENTS) return fail('Maximal 100.000 € pro Ausgabe.', amountInput);
      let paidBy = dict();
      if (f.multiPay) {
        paidBy = parseList(f.payAmounts);
        if (typeof paidBy === 'string') return fail(paidBy);
        const paid = sum(Object.values(paidBy));
        if (paid !== amount) return fail(`Die Zahler ergeben ${fmt(paid)}, die Ausgabe ist aber ${fmt(amount)}.`);
      } else {
        paidBy[f.payer] = amount;
      }
      let values = draftValues();
      if (f.mode === 'exact') {
        values = parseList(f.exact);
        if (typeof values === 'string') return fail(values);
        const given = sum(Object.values(values));
        if (given !== amount) return fail(`Die Beträge ergeben ${fmt(given)} statt ${fmt(amount)}.`);
      }
      if (!Object.keys(values).length) return fail('Wähle aus, wer dabei war.');
      const rec = commit('items', {
        id: draftId, kind: 'expense', amount,
        date: DATE_RE.test(f.date) ? f.date : isoDate(),
        created: ex ? ex.created : Date.now(),
        by: ex ? ex.by : me,
        title: f.title.trim() || CAT[f.category].label,
        category: f.category,
        paidBy,
        split: { mode: f.mode, values },
      });
      if (!rec) return;
      store.set(KEYS.date, rec.date);
      dlg.close();
      savedToast(ex ? 'Änderung gespeichert' : 'Ausgabe eingetragen');
    }

    function remove() {
      if (!confirm(`„${ex.title}“ löschen?`)) return;
      const before = { ...ex };
      commit('items', { id: ex.id, kind: 'expense', deleted: true });
      dlg.close();
      toast('Ausgabe gelöscht', { label: 'Rückgängig', run: () => commit('items', before) });
    }

    const created = ex ? `Eingetragen ${ex.by && state.members[ex.by] ? 'von ' + nameOf(ex.by) + ' ' : ''}am ${STAMP_FMT.format(ex.created)}` : null;
    fill(dlg, h('form', { class: 'sheet-form', novalidate: true, onsubmit: save },
      h('header', { class: 'sheet-head' },
        h('h2', { id: 'expenseDialogTitle' }, ex ? 'Ausgabe bearbeiten' : 'Neue Ausgabe'),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Schließen', onclick: () => dlg.close() }, icon('close', 20))),
      h('div', { class: 'sheet-body' },
        h('div', { class: 'amount-wrap' }, amountInput, h('span', { class: 'amount-cur', 'aria-hidden': 'true' }, '€')),
        titleInput,
        h('p', { class: 'label' }, 'Kategorie'), catRow,
        h('label', { class: 'label', for: 'expenseDate' }, 'Datum'), dateInput,
        h('p', { class: 'label' }, 'Bezahlt von'), paySection,
        h('p', { class: 'label' }, 'Aufteilen auf'), splitSection,
        created ? h('p', { class: 'meta-line' }, created) : null,
        errorEl),
      h('footer', { class: 'sheet-foot' },
        ex ? h('button', { type: 'button', class: 'btn btn-danger', onclick: remove }, 'Löschen') : null,
        h('button', { type: 'submit', class: 'btn btn-primary btn-grow' }, ex ? 'Speichern' : 'Eintragen'))));
    dlg.setAttribute('aria-labelledby', 'expenseDialogTitle');
    paintPay();
    paintSplit();
    refresh();
    fitAmount(amountInput);
    dlg.showModal();
    paintCategories();
    if (!ex) amountInput.focus();
  }

  function savedToast(message) {
    if (sync.mode === 'local') toast(message, { label: 'Stand teilen', run: shareState });
    else toast(message);
  }

  // --- Rückzahlung erfassen ---------------------------------------------------------
  function openPayment({ id, from, to, amount } = {}) {
    const dlg = $('#paymentDialog');
    const ex = id ? state.items[id] : null;
    if (id && (!ex || ex.deleted || ex.kind !== 'payment')) return;
    const me = currentMe();
    const people = members();
    if (ex) for (const pid of [ex.from, ex.to]) if (!people.some(p => p.id === pid)) people.push({ id: pid, name: nameOf(pid) });
    const f = { from: ex ? ex.from : from || me || people[0].id, to: ex ? ex.to : to || '', amount: ex ? toInput(ex.amount) : amount ? toInput(amount) : '', date: ex ? ex.date : isoDate() };
    if (!f.to || f.to === f.from) f.to = (people.find(p => p.id !== f.from) || {}).id || '';
    const draftId = ex ? ex.id : uid();
    const fromRow = h('div', { class: 'chips' });
    const toRow = h('div', { class: 'chips' });
    const errorEl = h('p', { class: 'form-error', role: 'alert' });
    const amountInput = h('input', { class: 'amount-input num', inputmode: 'decimal', autocomplete: 'off', placeholder: '0,00', value: f.amount, 'aria-label': 'Betrag in Euro', oninput: e => { f.amount = e.target.value; fitAmount(e.target); } });

    function paint() {
      fill(fromRow, people.map(p => h('button', {
        type: 'button', class: 'chip', 'aria-pressed': String(f.from === p.id),
        onclick: () => { f.from = p.id; if (f.to === p.id) f.to = (people.find(q => q.id !== p.id) || {}).id || ''; paint(); },
      }, avatar(p.id, 28), p.name)));
      fill(toRow, people.map(p => h('button', {
        type: 'button', class: 'chip', 'aria-pressed': String(f.to === p.id), disabled: p.id === f.from,
        onclick: () => { f.to = p.id; paint(); },
      }, avatar(p.id, 28), p.name)));
    }

    function save(e) {
      e.preventDefault();
      const cents = parseAmount(f.amount);
      if (!cents || cents > MAX_CENTS) { errorEl.textContent = 'Bitte gib einen gültigen Betrag ein.'; amountInput.focus(); return; }
      if (!f.to || f.to === f.from) { errorEl.textContent = 'Wähle aus, wer das Geld bekommen hat.'; return; }
      const rec = commit('items', { id: draftId, kind: 'payment', from: f.from, to: f.to, amount: cents, date: f.date, created: ex ? ex.created : Date.now(), by: ex ? ex.by : me });
      if (!rec) return;
      dlg.close();
      savedToast(ex ? 'Zahlung gespeichert' : 'Zahlung eingetragen');
    }

    function remove() {
      if (!confirm('Diese Zahlung löschen?')) return;
      const before = { ...ex };
      commit('items', { id: ex.id, kind: 'payment', deleted: true });
      dlg.close();
      toast('Zahlung gelöscht', { label: 'Rückgängig', run: () => commit('items', before) });
    }

    fill(dlg, h('form', { class: 'sheet-form', novalidate: true, onsubmit: save },
      h('header', { class: 'sheet-head' },
        h('h2', { id: 'paymentDialogTitle' }, ex ? 'Zahlung bearbeiten' : 'Zahlung eintragen'),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Schließen', onclick: () => dlg.close() }, icon('close', 20))),
      h('div', { class: 'sheet-body' },
        h('p', { class: 'muted small' }, 'Wenn jemand Geld zurückgegeben hat, z. B. per PayPal oder bar.'),
        h('p', { class: 'label' }, 'Wer hat gezahlt?'), fromRow,
        h('p', { class: 'label' }, 'An wen?'), toRow,
        h('div', { class: 'amount-wrap' }, amountInput, h('span', { class: 'amount-cur', 'aria-hidden': 'true' }, '€')),
        errorEl),
      h('footer', { class: 'sheet-foot' },
        ex ? h('button', { type: 'button', class: 'btn btn-danger', onclick: remove }, 'Löschen') : null,
        h('button', { type: 'submit', class: 'btn btn-primary btn-grow' }, 'Speichern'))));
    dlg.setAttribute('aria-labelledby', 'paymentDialogTitle');
    paint();
    fitAmount(amountInput);
    dlg.showModal();
  }

  function openKeyDialog(wrong) {
    const dlg = $('#keyDialog');
    if (dlg.open) dlg.close();
    const input = h('input', { class: 'field', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'Zugangscode', 'aria-label': 'Zugangscode' });
    const submit = e => {
      e.preventDefault();
      const key = input.value.trim();
      if (!key) return;
      accessKey = key;
      store.set(KEYS.key, key);
      dlg.close();
      sync.mode = 'offline';
      render();
      syncNow();
    };
    fill(dlg, h('form', { class: 'sheet-form', onsubmit: submit },
      h('header', { class: 'sheet-head' }, h('h2', { id: 'keyDialogTitle' }, 'Zugangscode')),
      h('div', { class: 'sheet-body' },
        h('p', { class: 'muted', style: 'margin-bottom:14px' }, wrong
          ? 'Der Code passt nicht. Am einfachsten öffnest du den Einladungslink aus eurer Gruppe – da steckt der Code schon drin.'
          : 'Diese Abrechnung ist geschützt. Öffne den Einladungslink aus eurer Gruppe oder gib den Zugangscode ein.'),
        input),
      h('footer', { class: 'sheet-foot' }, h('button', { type: 'submit', class: 'btn btn-primary btn-grow' }, 'Weiter'))));
    dlg.setAttribute('aria-labelledby', 'keyDialogTitle');
    dlg.showModal();
    input.focus();
  }

  // --- Teilen, Backup, Zurücksetzen ------------------------------------------------
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch { /* Fallback unten */ }
    try {
      const ta = h('textarea', { style: 'position:fixed;top:0;left:0;opacity:0' });
      ta.value = text;
      document.body.append(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch { return false; }
  }

  // Teilen-Menü des Handys (WhatsApp & Co.), sonst in die Zwischenablage.
  async function shareOrCopy(text) {
    if (navigator.share) {
      try { await navigator.share({ text }); return true; } catch (err) { if (err && err.name === 'AbortError') return false; }
    }
    if (await copyText(text)) { toast('Kopiert – jetzt z. B. in WhatsApp einfügen'); return true; }
    window.prompt('Zum Kopieren:', text);
    return true;
  }

  async function stateLink() {
    return pageUrl() + '#g=' + (await encodeState(state));
  }

  function inviteLink() {
    return pageUrl() + (accessKey ? '#k=' + encodeURIComponent(accessKey) : '');
  }

  function summaryText() {
    const s = summarize(state);
    const transfers = settle(s.bal);
    const count = members().length;
    const lines = [`${state.meta.group.name} – Abrechnung 💸`];
    if (!s.count) lines.push('Noch keine Ausgaben eingetragen.');
    else lines.push(`Gesamt: ${fmt(s.total)} · ${s.count} ${s.count === 1 ? 'Ausgabe' : 'Ausgaben'} · Ø ${fmt(Math.round(s.total / Math.max(1, count)))} pro Kopf`);
    lines.push('');
    if (transfers.length) {
      lines.push('Wer zahlt wem:');
      for (const t of transfers) {
        const paypal = state.members[t.to] && state.members[t.to].paypal;
        lines.push(`• ${nameOf(t.from)} → ${nameOf(t.to)}: ${fmt(t.amount)}` + (paypal ? ` (${paypalLink(paypal, t.amount)})` : ''));
      }
    } else if (s.count) {
      lines.push('Alle sind quitt 🎉');
    }
    lines.push('', `Stand: ${STAMP_FMT.format(Date.now())} Uhr`);
    return lines.join('\n');
  }

  async function shareSummary() {
    let link = '';
    try { link = sync.mode === 'local' ? await stateLink() : inviteLink(); } catch { link = pageUrl(); }
    const ok = await shareOrCopy(summaryText() + '\n\nAlle Details: ' + link);
    if (ok && sync.mode === 'local') { store.del(KEYS.dirty); render(); }
  }

  async function shareState() {
    let url;
    try { url = await stateLink(); } catch { toast('Der Link konnte nicht erstellt werden.'); return; }
    const n = activeItems().length;
    const ok = await shareOrCopy(`Mein Stand für „${state.meta.group.name}“ (${n} ${n === 1 ? 'Eintrag' : 'Einträge'}, Datenstand ${fingerprint(state)}). Link öffnen, dann hast du alles:\n${url}`);
    if (ok) { store.del(KEYS.dirty); render(); }
  }

  async function shareInvite() {
    await shareOrCopy(`Hier tragen wir die Ausgaben für „${state.meta.group.name}“ ein:\n${inviteLink()}`);
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(exportPayload(state), null, 2)], { type: 'application/json' });
    const name = (state.meta.group.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'abrechnung') + '-' + isoDate() + '.json';
    const a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  async function importBackup(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    e.target.blur();
    if (!file) return;
    try {
      const changed = mergeState(state, sanitizeState(JSON.parse(await file.text())));
      persist();
      render();
      scheduleSync();
      toast(changed.total ? `${changed.total} Änderungen übernommen` : 'Nichts Neues in der Datei');
    } catch {
      toast('Die Datei konnte nicht gelesen werden.');
    }
  }

  function resetLocal() {
    if (!confirm('Wirklich alle Einträge auf diesem Gerät löschen? Was du nicht geteilt hast, ist dann weg.')) return;
    for (const k of [KEYS.state, KEYS.me, KEYS.dirty, KEYS.date, KEYS.setup]) store.del(k);
    state = baseState();
    view = 'overview';
    render();
    toast('Alles zurückgesetzt');
  }

  // Link-Inhalte übernehmen: #k=Zugangscode (Server), #g=geteilter Stand
  async function readHash() {
    const params = new URLSearchParams(location.hash.slice(1));
    const key = params.get('k');
    const data = params.get('g');
    if (!key && !data) return;
    history.replaceState(null, '', location.pathname + location.search);
    if (key) { accessKey = key; store.set(KEYS.key, key); }
    if (!data) return;
    try {
      const changed = mergeState(state, await decodeState(data));
      persist();
      render();
      toast(changed.items ? `Link übernommen: ${changed.items} ${changed.items === 1 ? 'Eintrag' : 'Einträge'} neu oder geändert` : changed.total ? 'Link übernommen' : 'Du warst schon auf dem neuesten Stand');
    } catch {
      toast('Der Link ist unvollständig oder beschädigt.');
    }
  }

  // --- Start ----------------------------------------------------------------------
  function init() {
    for (const btn of document.querySelectorAll('[data-view]')) {
      btn.addEventListener('click', () => { view = btn.dataset.view; render(); window.scrollTo(0, 0); });
    }
    $('#fab').addEventListener('click', () => openExpense());
    $('#syncPill').addEventListener('click', () => {
      if (sync.mode === 'locked') return openKeyDialog(false);
      view = 'group';
      render();
      const card = $('#syncCard');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(); }, 0));
    // Ein Link kann auch in einem Tab landen, in dem die Seite schon offen ist – dann lädt sie nicht neu.
    window.addEventListener('hashchange', async () => {
      const keyBefore = accessKey;
      await readHash();
      if (accessKey !== keyBefore && sync.mode === 'locked') {
        const dlg = $('#keyDialog');
        if (dlg.open) dlg.close();
        sync.mode = 'offline';
        render();
      }
      scheduleSync();
    });
    window.addEventListener('storage', e => {
      if (e.key !== KEYS.state || !e.newValue) return;
      try { if (mergeState(state, sanitizeState(JSON.parse(e.newValue))).total) render(); } catch { /* ignorieren */ }
    });
    render();
    readHash().then(detectServer);
  }

  window.ADE = {
    parseAmount, shareOf, summarize, settle, sanitize, sanitizeState, mergeState, encodeState, decodeState,
    guessCategory, fingerprint, get state() { return state; }, get sync() { return sync; },
  };

  init();
})();
</script>
</body>
</html>
